name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: crm, POSTGRES_PASSWORD: ci, POSTGRES_DB: crm }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://crm:ci@localhost:5432/crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: PostgreSQL 18 client tools (pg_dump/pg_restore for M32)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env
      - run: docker compose config -q
      - run: docker compose build
